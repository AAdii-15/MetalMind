[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metalmind"
version = "2.0.0"
description = "News-sentiment-aware price forecasting for industrial metals (INR/kg)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Adityaraj Dhuria" }]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "feedparser>=6.0",
    "vaderSentiment>=3.3",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
metalmind = "metalmind.cli:main"

[tool.setuptools.packages.find]
include = ["metalmind*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
